name: 러너를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main      # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    # [변경] 주석만 수정: 내 우분투(WSL2)에 설치한 self-hosted 러너에서 실행됨
    runs-on: [self-hosted, kosa-label]

    steps:
    - name: git 저장소 소스 복사전의 폴더 구조
      run: ls -la
    
    - name: 소스 check out 
      uses: actions/checkout@v3

    - name: git 저장소 소스 복사후의 폴더 구조
      run: ls -la

    - name: git 저장소 소스 복사후의 hello 폴더 구조 # 리눅스 셀 명령어 2줄 이상 실행시
      run: |   
        ls -la
      
    - name: 메이븐 빌드
      run: mvn clean package

    - name: Docker Hub 로그인
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: 도커 이미지 빌드
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest .

    - name: 도커 이미지 푸시
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest

    # [삭제] SSH 개인키 생성 / ssh-agent / 서버 지문등록 3단계
    #  -> 러너가 이미 이 컴퓨터 안에서 실행되므로 다른 서버로 접속할 필요가 없음

    # [변경] ssh 접속 제거 -> 같은 컴퓨터에서 docker 명령을 바로 실행
    - name: 배포 실행 
      run: |
        # 기존 컨테이너 정지/삭제 (처음이라 없어도 에러로 멈추지 않게 || true)
        docker stop hello || true
        docker rm hello || true

        # 방금 빌드한 이미지가 이 컴퓨터에 있으므로 docker pull은 생략
        # 지금까지 성공한 방식 그대로 실행 (host 네트워크 + 자동 재시작)
        docker run -d --name hello --network host --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest

        # 교체된 이전 이미지 정리
        docker image prune -f